<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- LMU blue gradient (official WEC/LMU deep blue) -->
    <linearGradient id="lmuBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0066CC"/>
      <stop offset="100%" stop-color="#003D7A"/>
    </linearGradient>
    <!-- Racing orange accent (LMU timing orange) -->
    <linearGradient id="lmuOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6600"/>
      <stop offset="100%" stop-color="#FF9900"/>
    </linearGradient>
    <!-- White gradient -->
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E8F0"/>
    </linearGradient>
    <!-- Subtle radial glow -->
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#0066CC" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0066CC" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark racing background -->
  <rect width="512" height="512" rx="24" fill="#0A0E1A"/>

  <!-- Blue glow aura -->
  <circle cx="256" cy="200" r="160" fill="url(#glow)"/>

  <!-- Top accent strip (LMU blue) -->
  <rect x="56" y="56" width="400" height="3" rx="1.5" fill="url(#lmuBlue)"/>
  <!-- Bottom accent strip (orange) -->
  <rect x="56" y="453" width="400" height="3" rx="1.5" fill="url(#lmuOrange)"/>

  <!-- Circuit track outline (abstract Le Mans-style esses) -->
  <path d="M80 380 Q80 220 200 200 Q340 180 340 300 Q340 370 260 370 Q180 370 180 300 Q180 240 260 240"
        fill="none" stroke="#1A2A4A" stroke-width="2" stroke-dasharray="10 8" opacity="0.5"/>

  <!-- Main text block -->
  <!-- "Le Mans" style — condensed bold uppercase -->
  <text x="256" y="180" text-anchor="middle"
        font-family="'Saira Condensed','Saira','Segoe UI',sans-serif"
        font-size="72" font-weight="900" fill="url(#whiteGrad)"
        letter-spacing="4">LE MANS</text>

  <!-- "ULTIMATE" — orange accent, wider spacing -->
  <text x="256" y="240" text-anchor="middle"
        font-family="'Saira Condensed','Saira','Segoe UI',sans-serif"
        font-size="48" font-weight="700" fill="url(#lmuOrange)"
        letter-spacing="12">ULTIMATE</text>

  <!-- Divider -->
  <rect x="206" y="260" width="100" height="2" rx="1" fill="url(#lmuBlue)"/>

  <!-- "LarpTimes" — app name, condensed -->
  <text x="256" y="300" text-anchor="middle"
        font-family="'Saira Condensed','Saira','Segoe UI',sans-serif"
        font-size="36" font-weight="600" fill="#FFFFFF"
        letter-spacing="3">LARP<span fill="url(#lmuOrange)">TIMES</span></text>

  <!-- Subtitle -->
  <text x="256" y="330" text-anchor="middle"
        font-family="'Saira','Segoe UI',sans-serif"
        font-size="14" font-weight="400" fill="#6080A0"
        letter-spacing="6">PIT STRATEGIST</text>

  <!-- Speedometer-style accent dots -->
  <g transform="translate(256, 400)">
    <circle cx="-60" cy="0" r="4" fill="#FF6600"/>
    <circle cx="-40" cy="0" r="2" fill="#6080A0"/>
    <circle cx="-20" cy="0" r="4" fill="#FF6600"/>
    <circle cx="0" cy="0" r="2" fill="#6080A0"/>
    <circle cx="20" cy="0" r="4" fill="#FF6600"/>
    <circle cx="40" cy="0" r="2" fill="#6080A0"/>
    <circle cx="60" cy="0" r="4" fill="#FF6600"/>
  </g>

  <!-- Version badge -->
  <rect x="196" y="420" width="120" height="22" rx="3" fill="#0D1528" stroke="#1A2A4A" stroke-width="1"/>
  <text x="256" y="436" text-anchor="middle"
        font-family="'Saira','monospace'" font-size="12" font-weight="600" fill="#FF6600"
        letter-spacing="2">v0.1.0-beta</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <pattern id="carbon" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#0A0C0E"/>
      <rect x="0" y="0" width="4" height="4" fill="#0F1317"/>
      <rect x="4" y="4" width="4" height="4" fill="#0F1317"/>
    </pattern>
    <radialGradient id="glowLeft" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="85%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0088FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0088FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="50%" stop-color="#FF8800"/>
      <stop offset="100%" stop-color="#FF2200"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="#070809"/>
  <rect width="1200" height="400" fill="url(#carbon)" opacity="0.4"/>
  <rect width="1200" height="400" fill="url(#glowLeft)"/>
  <rect width="1200" height="400" fill="url(#glowRight)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="4" height="400" fill="url(#amberGrad)"/>

  <!-- Bottom line -->
  <rect x="0" y="396" width="1200" height="4" fill="url(#amberGrad)" opacity="0.3"/>

  <!-- Speed lines decoration -->
  <g opacity="0.1" stroke="#F0F4F8" stroke-width="1">
    <line x1="700" y1="80" x2="1150" y2="80"/>
    <line x1="750" y1="120" x2="1100" y2="120"/>
    <line x1="800" y1="160" x2="1050" y2="160"/>
    <line x1="780" y1="200" x2="1120" y2="200"/>
    <line x1="730" y1="240" x2="1080" y2="240"/>
    <line x1="700" y1="280" x2="1150" y2="280"/>
    <line x1="760" y1="320" x2="1100" y2="320"/>
  </g>

  <!-- Circuit track silhouette -->
  <path d="M700 350 Q700 50 950 50 Q1200 50 1200 200 Q1200 350 950 350 Q750 350 750 250 Q750 150 900 150 Q1020 150 1020 230" 
        fill="none" stroke="#1E252C" stroke-width="1.5" opacity="0.4"/>

  <!-- Logo area (left) -->
  <!-- LMU emblem simplified -->
  <g transform="translate(60, 80)">
    <!-- Glow circle -->
    <circle cx="120" cy="120" r="90" fill="none" stroke="#FF6B00" stroke-width="0.5" opacity="0.2"/>
    <circle cx="120" cy="120" r="100" fill="none" stroke="#FF6B00" stroke-width="0.3" opacity="0.1"/>

    <!-- L -->
    <rect x="55" y="55" width="14" height="90" rx="2" fill="url(#amberGrad)"/>
    <rect x="55" y="131" width="55" height="14" rx="2" fill="url(#amberGrad)"/>

    <!-- M -->
    <polygon points="135,145 148,55 165,110 182,55 195,145" fill="url(#amberGrad)"/>
    <polygon points="143,145 152,65 165,105 178,65 187,145" fill="#070809"/>
    <rect x="150" y="110" width="12" height="35" fill="#070809"/>
    <rect x="158" y="110" width="8" height="35" fill="#070809"/>

    <!-- U -->
    <path d="M215 55 L215 130 Q215 160 238 160 Q261 160 261 130 L261 55" 
          fill="none" stroke="url(#amberGrad)" stroke-width="14" stroke-linecap="round"/>
    <path d="M222 55 L222 130 Q222 153 238 153 Q254 153 254 130 L254 55" 
          fill="none" stroke="#070809" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Text area -->
  <g transform="translate(360, 100)">
    <text x="0" y="0" font-family="'Rajdhani','Segoe UI',sans-serif" font-size="64" font-weight="700"
          fill="#F0F4F8" letter-spacing="6">LMU</text>
    <text x="0" y="64" font-family="'Rajdhani','Segoe UI',sans-serif" font-size="64" font-weight="700"
          fill="#F0F4F8" letter-spacing="6">
      <tspan fill="#FF6B00">Larp</tspan>Times
    </text>

    <!-- Subtitle -->
    <text x="0" y="110" font-family="'Inter','Segoe UI',sans-serif" font-size="16" font-weight="500"
          fill="#5A6A7A" letter-spacing="4">PIT STRATEGIST FOR LE MANS ULTIMATE</text>

    <!-- Divider -->
    <rect x="0" y="130" width="60" height="3" rx="1.5" fill="url(#amberGrad)"/>

    <!-- Feature tags -->
    <g transform="translate(0, 155)" font-family="'Inter','Segoe UI',sans-serif" font-size="11" fill="#7A8A9A">
      <rect x="0" y="-8" width="80" height="22" rx="2" fill="#0F1317" stroke="#1E252C" stroke-width="1"/>
      <text x="40" y="6" text-anchor="middle">🏎 Overlay</text>

      <rect x="90" y="-8" width="80" height="22" rx="2" fill="#0F1317" stroke="#1E252C" stroke-width="1"/>
      <text x="130" y="6" text-anchor="middle">⏱ Strategy</text>

      <rect x="180" y="-8" width="65" height="22" rx="2" fill="#0F1317" stroke="#1E252C" stroke-width="1"/>
      <text x="212" y="6" text-anchor="middle">🎙 TTS</text>

      <rect x="255" y="-8" width="85" height="22" rx="2" fill="#0F1317" stroke="#1E252C" stroke-width="1"/>
      <text x="297" y="6" text-anchor="middle">📊 Telemetry</text>
    </g>
  </g>

  <!-- Version badge (bottom-right) -->
  <g transform="translate(1050, 360)">
    <rect x="0" y="0" width="120" height="24" rx="2" fill="#0F1317" stroke="#1E252C" stroke-width="1"/>
    <text x="60" y="16" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#FF6B00">v0.1.0-beta</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320">
  <defs>
    <linearGradient id="lmuBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#003D7A"/>
      <stop offset="100%" stop-color="#0066CC"/>
    </linearGradient>
    <linearGradient id="lmuOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6600"/>
      <stop offset="100%" stop-color="#FF9900"/>
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C0D0E0"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="15%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0066CC" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0066CC" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" fill="#0A0E1A"/>

  <!-- Subtle blue glow on left -->
  <rect width="1280" height="320" fill="url(#glowLeft)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1280" height="4" fill="url(#lmuBlue)"/>
  <!-- Bottom accent bar -->
  <rect x="0" y="316" width="1280" height="4" fill="url(#lmuOrange)" opacity="0.6"/>

  <!-- Left accent vertical bar -->
  <rect x="0" y="0" width="3" height="320" fill="url(#lmuBlue)"/>

  <!-- Speed lines (subtle, right side) -->
  <g opacity="0.04" stroke="#FFFFFF" stroke-width="1">
    <line x1="600" y1="40" x2="1280" y2="40"/>
    <line x1="650" y1="80" x2="1280" y2="80"/>
    <line x1="580" y1="240" x2="1280" y2="240"/>
    <line x1="620" y1="280" x2="1280" y2="280"/>
  </g>

  <!-- Circuit track silhouette -->
  <path d="M550 280 Q550 60 750 60 Q950 60 950 180 Q950 280 800 280 Q650 280 650 200 Q650 120 800 120"
        fill="none" stroke="#1A2A4A" stroke-width="2" opacity="0.3"/>

  <!-- Main text block -->
  <g transform="translate(80, 90)">
    <!-- LE MANS -->
    <text x="0" y="0"
          font-family="'Saira Condensed','Saira','Segoe UI',sans-serif"
          font-size="56" font-weight="900" fill="url(#whiteGrad)"
          letter-spacing="3">LE MANS</text>

    <!-- ULTIMATE (orange) -->
    <text x="0" y="48"
          font-family="'Saira Condensed','Saira','Segoe UI',sans-serif"
          font-size="36" font-weight="700" fill="url(#lmuOrange)"
          letter-spacing="10">ULTIMATE</text>

    <!-- Divider -->
    <rect x="0" y="65" width="50" height="2" fill="url(#lmuBlue)"/>

    <!-- LarpTimes -->
    <text x="0" y="110"
          font-family="'Saira Condensed','Saira','Segoe UI',sans-serif"
          font-size="42" font-weight="600" fill="url(#whiteGrad)"
          letter-spacing="2">LARP<span fill="url(#lmuOrange)">TIMES</span></text>

    <!-- Subtitle -->
    <text x="0" y="145"
          font-family="'Saira','Segoe UI',sans-serif"
          font-size="16" font-weight="400" fill="#6080A0"
          letter-spacing="5">PIT STRATEGIST &amp; TELEMETRY</text>
  </g>

  <!-- Feature badges -->
  <g transform="translate(80, 250)" font-family="'Saira','Segoe UI',sans-serif" font-size="12" font-weight="500">
    <rect x="0" y="-10" width="90" height="22" rx="3" fill="#0D1528" stroke="#1A2A4A" stroke-width="1"/>
    <text x="45" y="5" text-anchor="middle" fill="#C0D0E0">🏎 Overlay</text>

    <rect x="100" y="-10" width="95" height="22" rx="3" fill="#0D1528" stroke="#1A2A4A" stroke-width="1"/>
    <text x="147" y="5" text-anchor="middle" fill="#C0D0E0">⏱ Strategy</text>

    <rect x="205" y="-10" width="80" height="22" rx="3" fill="#0D1528" stroke="#1A2A4A" stroke-width="1"/>
    <text x="245" y="5" text-anchor="middle" fill="#C0D0E0">🎙 TTS</text>

    <rect x="295" y="-10" width="100" height="22" rx="3" fill="#0D1528" stroke="#1A2A4A" stroke-width="1"/>
    <text x="345" y="5" text-anchor="middle" fill="#C0D0E0">📊 Dashboard</text>

    <rect x="405" y="-10" width="75" height="22" rx="3" fill="#0D1528" stroke="#1A2A4A" stroke-width="1"/>
    <text x="442" y="5" text-anchor="middle" fill="#C0D0E0">🌦 Weather</text>
  </g>

  <!-- Version badge -->
  <g transform="translate(1160, 280)">
    <rect x="-60" y="-12" width="100" height="24" rx="3" fill="#0D1528" stroke="#1A2A4A" stroke-width="1"/>
    <text x="-10" y="4" text-anchor="middle" font-family="'Saira','monospace'" font-size="12" font-weight="600" fill="#FF6600">v0.1.0-beta</text>
  </g>
</svg>
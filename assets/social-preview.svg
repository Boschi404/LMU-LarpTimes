<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <pattern id="carbon" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#0A0C0E"/>
      <rect x="0" y="0" width="4" height="4" fill="#0F1317"/>
      <rect x="4" y="4" width="4" height="4" fill="#0F1317"/>
    </pattern>
    <radialGradient id="glowCenter" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#070809" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="50%" stop-color="#FF8800"/>
      <stop offset="100%" stop-color="#FF2200"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="#070809"/>
  <rect width="1280" height="640" fill="url(#carbon)" opacity="0.4"/>
  <rect width="1280" height="640" fill="url(#glowCenter)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1280" height="4" fill="url(#amberGrad)"/>
  <!-- Bottom accent bar -->
  <rect x="0" y="636" width="1280" height="4" fill="url(#amberGrad)" opacity="0.3"/>

  <!-- Left vertical accent -->
  <rect x="0" y="0" width="3" height="640" fill="url(#amberGrad)" opacity="0.5"/>

  <!-- Speed lines -->
  <g opacity="0.06" stroke="#F0F4F8" stroke-width="1">
    <line x1="150" y1="100" x2="1280" y2="100"/>
    <line x1="200" y1="200" x2="1280" y2="200"/>
    <line x1="100" y1="300" x2="1280" y2="300"/>
    <line x1="250" y1="400" x2="1280" y2="400"/>
    <line x1="180" y1="500" x2="1280" y2="500"/>
  </g>

  <!-- Track outline -->
  <path d="M640 640 Q640 100 640 100 Q640 -50 800 -50 Q960 -50 960 100 Q960 250 800 250 Q640 250 640 350 Q640 450 500 450 Q340 450 340 350 Q340 250 500 250" 
        fill="none" stroke="#1E252C" stroke-width="2" opacity="0.3"/>

  <!-- Center content -->
  <g transform="translate(640, 240)" text-anchor="middle">
    <!-- LMU large -->
    <text x="0" y="-60" font-family="'Rajdhani','Segoe UI',sans-serif" font-size="120" font-weight="700"
          fill="#F0F4F8" letter-spacing="20">LMU</text>

    <!-- LarpTimes -->
    <text x="0" y="50" font-family="'Rajdhani','Segoe UI',sans-serif" font-size="72" font-weight="700"
          fill="#FF6B00" letter-spacing="12">LarpTimes</text>

    <!-- Subtitle -->
    <text x="0" y="105" font-family="'Inter','Segoe UI',sans-serif" font-size="22" font-weight="500"
          fill="#7A8A9A" letter-spacing="8">PIT STRATEGIST</text>

    <!-- Divider -->
    <rect x="-80" y="130" width="160" height="3" rx="1.5" fill="url(#amberGrad)"/>

    <!-- Tagline -->
    <text x="0" y="170" font-family="'Inter','Segoe UI',sans-serif" font-size="16" font-weight="400"
          fill="#5A6A7A" letter-spacing="3">TELEMETRY &amp; RACE STRATEGY FOR LE MANS ULTIMATE</text>
  </g>

  <!-- Feature pills -->
  <g transform="translate(640, 500)" text-anchor="middle" font-family="'Inter','Segoe UI',sans-serif" font-size="13" fill="#C8D4E0">
    <rect x="-320" y="-12" width="100" height="28" rx="2" fill="#0F1317" stroke="#283038" stroke-width="1"/>
    <text x="-270" y="7">🏎 In-Game Overlay</text>

    <rect x="-205" y="-12" width="90" height="28" rx="2" fill="#0F1317" stroke="#283038" stroke-width="1"/>
    <text x="-160" y="7">⏱ Pit Strategy</text>

    <rect x="-100" y="-12" width="95" height="28" rx="2" fill="#0F1317" stroke="#283038" stroke-width="1"/>
    <text x="-52" y="7">🎙 Race Engineer</text>

    <rect x="10" y="-12" width="105" height="28" rx="2" fill="#0F1317" stroke="#283038" stroke-width="1"/>
    <text x="62" y="7">📊 Web Dashboard</text>

    <rect x="130" y="-12" width="90" height="28" rx="2" fill="#0F1317" stroke="#283038" stroke-width="1"/>
    <text x="175" y="7">🌦 Weather</text>

    <rect x="235" y="-12" width="80" height="28" rx="2" fill="#0F1317" stroke="#283038" stroke-width="1"/>
    <text x="275" y="7">🔧 Setup</text>
  </g>

  <!-- Bottom-left version -->
  <text x="40" y="620" font-family="'JetBrains Mono',monospace" font-size="13" fill="#5A6A7A">v0.1.0-beta</text>

  <!-- Bottom-right URL -->
  <text x="1240" y="620" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="12" fill="#35404A">github.com/Boschi404/LMU-LarpTimes</text>
</svg>

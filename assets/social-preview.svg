<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="lmuBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#003D7A"/>
      <stop offset="100%" stop-color="#0066CC"/>
    </linearGradient>
    <linearGradient id="lmuOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6600"/>
      <stop offset="100%" stop-color="#FF9900"/>
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C0D0E0"/>
    </linearGradient>
    <radialGradient id="glowCenter" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#0066CC" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0A0E1A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="#0A0E1A"/>
  <rect width="1280" height="640" fill="url(#glowCenter)"/>

  <!-- Top/bottom accent bars -->
  <rect x="0" y="0" width="1280" height="4" fill="url(#lmuBlue)"/>
  <rect x="0" y="636" width="1280" height="4" fill="url(#lmuOrange)" opacity="0.6"/>

  <!-- Speed lines -->
  <g opacity="0.03" stroke="#FFFFFF" stroke-width="1">
    <line x1="100" y1="80" x2="1280" y2="80"/>
    <line x1="150" y1="160" x2="1280" y2="160"/>
    <line x1="80" y1="480" x2="1280" y2="480"/>
    <line x1="120" y1="560" x2="1280" y2="560"/>
  </g>

  <!-- Track silhouette -->
  <path d="M640 640 Q640 80 800 80 Q960 80 960 220 Q960 360 800 360 Q640 360 640 440 Q640 520 480 520 Q320 520 320 440 Q320 360 480 360"
        fill="none" stroke="#1A2A4A" stroke-width="2" opacity="0.25"/>

  <!-- Main centered content -->
  <g transform="translate(640, 220)" text-anchor="middle">
    <!-- LE MANS -->
    <text x="0" y="-30"
          font-family="'Saira Condensed','Saira','Segoe UI',sans-serif"
          font-size="96" font-weight="900" fill="url(#whiteGrad)"
          letter-spacing="6">LE MANS</text>

    <!-- ULTIMIMATE -->
    <text x="0" y="40"
          font-family="'Saira Condensed','Saira','Segoe UI',sans-serif"
          font-size="64" font-weight="700" fill="url(#lmuOrange)"
          letter-spacing="16">ULTIMATE</text>

    <!-- Divider -->
    <rect x="-100" y="60" width="200" height="3" rx="1.5" fill="url(#lmuBlue)"/>

    <!-- LarpTimes -->
    <text x="0" y="115"
          font-family="'Saira Condensed','Saira','Segoe UI',sans-serif"
          font-size="52" font-weight="600" fill="url(#whiteGrad)"
          letter-spacing="4">LARP<span fill="url(#lmuOrange)">TIMES</span></text>

    <!-- Tagline -->
    <text x="0" y="155"
          font-family="'Saira','Segoe UI',sans-serif"
          font-size="18" font-weight="400" fill="#6080A0"
          letter-spacing="8">PIT STRATEGIST &amp; TELEMETRY</text>
  </g>

  <!-- Feature pills row -->
  <g transform="translate(640, 470)" text-anchor="middle"
     font-family="'Saira','Segoe UI',sans-serif" font-size="14" font-weight="500" fill="#C0D0E0">
    <rect x="-350" y="-14" width="100" height="30" rx="4" fill="#0D1528" stroke="#1A2A4A"/>
    <text x="-300" y="7">🏎 Overlay</text>

    <rect x="-230" y="-14" width="105" height="30" rx="4" fill="#0D1528" stroke="#1A2A4A"/>
    <text x="-177" y="7">⏱ Pit Strategy</text>

    <rect x="-110" y="-14" width="105" height="30" rx="4" fill="#0D1528" stroke="#1A2A4A"/>
    <text x="-57" y="7">🎙 Race Engineer</text>

    <rect x="10" y="-14" width="110" height="30" rx="4" fill="#0D1528" stroke="#1A2A4A"/>
    <text x="65" y="7">📊 Web Dashboard</text>

    <rect x="135" y="-14" width="95" height="30" rx="4" fill="#0D1528" stroke="#1A2A4A"/>
    <text x="182" y="7">🌦 Weather</text>

    <rect x="245" y="-14" width="90" height="30" rx="4" fill="#0D1528" stroke="#1A2A4A"/>
    <text x="290" y="7">🔧 Setup</text>
  </g>

  <!-- Version + URL -->
  <text x="40" y="615" font-family="'Saira','monospace'" font-size="13" font-weight="600" fill="#FF6600">v0.1.0-beta</text>
  <text x="1240" y="615" text-anchor="end" font-family="'Saira','monospace'" font-size="12" fill="#6080A0">github.com/Boschi404/LMU-LarpTimes</text>
</svg>
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LMU LarpTimes — Accesso</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: #0A0C0E;
  color: #F0F4F8;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card {
  background: #0F1317;
  border: 1px solid #1E252C;
  border-radius: 2px;
  padding: 48px 40px 36px;
  width: 420px;
  max-width: 90vw;
  text-align: center;
}
.card h1 { font-family: 'Rajdhani', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: 2px; margin-bottom: 4px; text-transform: uppercase; }
.card .subtitle { color: #5A6A7A; font-size: 13px; margin-bottom: 32px; }
.brand-bar {
  width: 60px; height: 3px;
  background: linear-gradient(90deg, #FF6B00, #FF2200);
  border-radius: 2px;
  margin: 0 auto 24px;
}
.tabs { display: flex; gap: 0; margin-bottom: 28px; background: #0A0C0E; border-radius: 2px; padding: 3px; border: 1px solid #1E252C; }
.tab { flex: 1; padding: 10px; border: none; background: transparent; color: #5A6A7A; font-size: 14px; font-weight: 600; cursor: pointer; border-radius: 2px; transition: all 0.2s; font-family: 'Rajdhani', sans-serif; text-transform: uppercase; letter-spacing: 0.05em; }
.tab.active { background: #FF6B00; color: #fff; }
.form-group { text-align: left; margin-bottom: 18px; }
.form-group label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #5A6A7A; margin-bottom: 6px; font-family: 'Rajdhani', sans-serif; }
.form-group input {
  width: 100%; padding: 12px 14px; background: #1E252C;
  border: 1px solid #283038; border-radius: 2px; color: #F0F4F8;
  font-size: 15px; font-family: 'JetBrains Mono', monospace;
  outline: none; transition: border-color 0.2s;
}
.form-group input:focus { border-color: #FF6B00; }
.form-group input::placeholder { color: #7A8A9A; }

/* Focus-visible: keyboard navigation outline */
a:focus-visible,
button:focus-visible,
input:focus-visible {
  outline: 2px solid #FF6B00;
  outline-offset: 2px;
}

.tab:focus-visible {
  outline-offset: -2px;
}

/* Skip link */
.skip-link {
  position: absolute;
  top: -100px;
  left: 8px;
  background: #FF6B00;
  color: #fff;
  padding: 8px 16px;
  border-radius: 2px;
  font-weight: 700;
  font-size: 0.85rem;
  z-index: 10000;
  text-decoration: none;
  transition: top 0.2s ease;
}
.skip-link:focus {
  top: 8px;
}

.btn {
  width: 100%; padding: 12px; background: #FF6B00; border: none;
  border-radius: 2px; color: #fff; font-size: 15px; font-weight: 600;
  cursor: pointer; transition: background 0.2s; margin-top: 8px;
  font-family: 'Rajdhani', sans-serif; text-transform: uppercase; letter-spacing: 0.05em;
}
.btn:hover { background: #FF8800; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-secondary { background: #283038; margin-top: 4px; }
.btn-secondary:hover { background: #35404A; }
.error-msg { color: #FF2200; font-size: 13px; margin-top: 12px; display: none; }
.error-msg[role="alert"] { display: none; }
.info-msg { color: #00FF88; font-size: 13px; margin-top: 12px; display: none; }
.info-msg[role="alert"] { display: none; }

.form-box { display: none; }
.form-box.active { display: block; }
</style>
</head>
<body>

<a href="#login-main" class="skip-link">Skip to main content</a>

<div class="card" id="login-main">
  <div class="brand-bar"></div>
  <h1>LMU LarpTimes</h1>
  <p class="subtitle">Pit Strategist</p>

  <div class="tabs" role="tablist" aria-label="Authentication options">
    <button class="tab active" onclick="switchTab('login')" id="tab-login" role="tab" aria-selected="true" aria-controls="form-login">Accedi</button>
    <button class="tab" onclick="switchTab('register')" id="tab-register" role="tab" aria-selected="false" aria-controls="form-register">Registrati</button>
  </div>

  <form id="form-login" class="form-box active" onsubmit="event.preventDefault(); doLogin();">
    <div class="form-group">
      <label for="login-email">Email</label>
      <input id="login-email" type="email" placeholder="tu@example.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label for="login-password">Password</label>
      <input id="login-password" type="password" placeholder="●●●●●●" autocomplete="current-password">
    </div>
    <button class="btn" id="login-btn" type="submit">Accedi</button>
    <div class="error-msg" id="login-error" role="alert"></div>
  </form>

  <form id="form-register" class="form-box" onsubmit="event.preventDefault(); doRegister();">
    <div class="form-group">
      <label for="reg-email">Email</label>
      <input id="reg-email" type="email" placeholder="tu@example.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label for="reg-name">Nome visualizzato</label>
      <input id="reg-name" type="text" placeholder="Il tuo nome">
    </div>
    <div class="form-group">
      <label for="reg-password">Password</label>
      <input id="reg-password" type="password" placeholder="min 4 caratteri" autocomplete="new-password">
    </div>
    <button class="btn" id="reg-btn" type="submit">Crea account</button>
    <div class="error-msg" id="reg-error" role="alert"></div>
    <div class="info-msg" id="reg-info" role="alert"></div>
  </form>

  <p class="footer">I tuoi dati restano sul tuo computer.</p>
</div>

<script>
let currentTab = 'login';

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.remove('active');
    t.setAttribute('aria-selected', 'false');
  });
  var activeTab = document.getElementById('tab-' + tab);
  activeTab.classList.add('active');
  activeTab.setAttribute('aria-selected', 'true');
  document.querySelectorAll('.form-box').forEach(f => f.classList.remove('active'));
  document.getElementById('form-' + tab).classList.add('active');
  document.getElementById('login-error').style.display = 'none';
  document.getElementById('reg-error').style.display = 'none';
}

async function apiCall(url, data) {
  const r = await fetch(url, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data)
  });
  return { ok: r.ok, status: r.status, data: await r.json() };
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const err = document.getElementById('login-error');
  err.style.display = 'none';

  if (!email || !password) {
    err.textContent = 'Compila tutti i campi';
    err.style.display = 'block'; return;
  }

  const btn = document.getElementById('login-btn');
  btn.disabled = true; btn.textContent = 'Accesso in corso...';

  const res = await apiCall('/api/auth/login', { email, password });
  if (res.ok) {
    localStorage.setItem('token', res.data.token);
    localStorage.setItem('user', JSON.stringify(res.data.user));
    window.location.href = '/';
  } else {
    err.textContent = res.data.error || 'Email o password errati';
    err.style.display = 'block';
  }
  btn.disabled = false; btn.textContent = 'Accedi';
}

async function doRegister() {
  const email = document.getElementById('reg-email').value.trim();
  const display_name = document.getElementById('reg-name').value.trim() || email.split('@')[0];
  const password = document.getElementById('reg-password').value;
  const err = document.getElementById('reg-error');
  const info = document.getElementById('reg-info');
  err.style.display = 'none'; info.style.display = 'none';

  if (!email || !password) {
    err.textContent = 'Compila tutti i campi';
    err.style.display = 'block'; return;
  }

  const btn = document.getElementById('reg-btn');
  btn.disabled = true; btn.textContent = 'Registrazione in corso...';

  const res = await apiCall('/api/auth/register', { email, password, display_name });
  if (res.ok) {
    info.textContent = 'Account creato! Reindirizzamento...';
    info.style.display = 'block';
    localStorage.setItem('token', res.data.token);
    localStorage.setItem('user', JSON.stringify(res.data.user));
    setTimeout(() => window.location.href = '/', 500);
  } else {
    err.textContent = res.data.error || 'Errore di registrazione';
    err.style.display = 'block';
  }
  btn.disabled = false; btn.textContent = 'Crea account';
}

// Enter key support
document.getElementById('login-password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('reg-password').addEventListener('keydown', e => { if (e.key === 'Enter') doRegister(); });
</script>
</body>
</html>
